  <div class="filter-container">
    <div class="wizard">
      <!-- <gn-wizard #wizard [lstItems]="lstItems" [pWizard]="pWizard" [check]="false" [tabs]="true" (tabSelected)="tab($event)"></gn-wizard> -->
      <gn-filtro-tiempo #wizard id="tiempo" [lstYears]="lstItems" (emitYear)="tab($event)"></gn-filtro-tiempo>
    </div>
  </div>

  <div class="search">
    <div class="searchBar">
      <gn-search-bar [searchValue]="searchTerm" [placeholder]="placeholder" [reset]="resetSearch" (searchTermChanged)="searchTermChanged($event)" ></gn-search-bar>
    </div>

    <img *ngIf="cuadricula" (click)="cuadricula = true" src="./assets/images/vista_cuadricula_azul.svg" alt="">
    <img *ngIf="!cuadricula" (click)="cuadricula = true" src="./assets/images/vista_cuadricula_gris.svg" alt="">
    <img *ngIf="!cuadricula" (click)="cuadricula = false" src="./assets/images/vista_lista_azul.svg" alt="">
    <img *ngIf="cuadricula" (click)="cuadricula = false" src="./assets/images/vista_lista_gris.svg" alt="">
  </div>

  <div class="body1" *ngIf="cuadricula" >
    <div class="item" *ngFor='let item of array2; let i = index' (click)="historialImportaciones(item.idProducto)">
      <div class="img">
        <img id="img1" src="./assets/images/prevision_gris.svg" alt="">
        <img id="img2" src="./assets/images/prevision_hover_azul.svg" alt="">
      </div>
      <div class="bodyItem" [ngStyle]="{'position':'relative'}">
        <p [ngStyle]="{'font-size':'14px'}"> <label [ngStyle]="{'font-weight':'700'}"># {{i+1}} · </label> <label>{{item.codigo}}  · </label> {{item.nombre}} </p>
        <div class="bar">
          <div class="contentBar animated bounceInLeft" [style.width]="((item.totalProducto/item.cantidad)*100) + '%'">
          </div>
        </div>
        <p [ngStyle]="{'font-size':'10px'}" ><label >{{item.totalProducto}} {{item.unidad}} de &nbsp;</label><label>{{item.cantidad}} {{item.unidad}}</label></p>
      </div>
    </div>
  </div>

  <div class="body2" *ngIf="!cuadricula" >
    <div class="item" *ngFor='let item of array2; let i = index' (click)="historialImportaciones(item.idProducto)">

      <div class="img">
        <img id="img1" src="./assets/images/prevision_gris.svg" alt="">
        <img id="img2" src="./assets/images/prevision_hover_azul.svg" alt="">

      </div>
      <div class="bodyItem">
        <div class="part1">
          <p><label># {{i+1}}  · </label>  <label>{{item.codigo}}  · </label>   <label>{{item.nombre}}</label> </p>
          <div class="bar">
            <div class="contentBar animated bounceInLeft" [style.width]="((item.totalProducto/item.cantidad)*100) + '%'">
            </div>
          </div>
          <p><label >{{item.totalProducto}} {{item.unidad}} de &nbsp;</label><label>{{item.cantidad}} {{item.unidad}}</label></p>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <label>{{array2.length == 1 ? "# " + array2.length + " Producto" : "# " +array2.length + " Productos"}}</label>
  </div>

</div>

<div id="id01" class="w3-modal">
  <div [ngClass]="'w3-modal-content ' + classAnimation + ' w3-card-4'">
    <div class="modal">
      <div class="title">
        <p>
          <label>Agregar Previsión Extemporánea</label>
        </p>
        <img (click)="cerrarPrevison()" src="./assets/images/cerrar_azul.svg" alt="" onclick="setTimeout(function(){document.getElementById('id01').style.display='none'}, 198)" [ngStyle]="{'margin-right':'-18px'}">
      </div>
      <div class="header">
        <div class="label">
          <label>Diluyente p/Dynastat Iny Pitex 8(mg)</label>
        </div>
      </div>
      <div class="body" >
        <form [formGroup]="modalForm" autocomplete="off">
          <div class="cForm" [ngStyle]="{'width':'70%'}">
            <label>Cantidad</label>
            <input type="text" name="" value="">
          </div>
          <div class="cForm" [ngStyle]="{'align-items': 'flex-end', 'width':'30%'}">
            <label [ngStyle]="{'margin-bottom':'6px', 'width': '80px'}">Unidad</label>
            <div class="droplist" [ngStyle]="{'width': '80px'}">
              <gn-drop-list (valueDropList)="dropList($event)" [items]="itemsDropList" [isSearch]="false" [isCategory]="true" [align]="'left'"
                            [itemSelect]="defaultSelected1" [fontSize]="'12px'"></gn-drop-list>
            </div>
          </div>
          <div class="cForm" [ngStyle]="{'width':'100%', 'margin-top': '5px'}">
            <label>Descripción</label>
            <textarea [ngStyle]="{'height':'80px'}"></textarea>
          </div>
        </form>
      </div>
      <div class="footer">
        <a class="cancelar">CANCELAR</a>
        <a class="guardar">AGREGAR</a>
      </div>
    </div>
  </div>
</div>
