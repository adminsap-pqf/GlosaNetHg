<div class="container">
  
   

  <div class="row" [ngStyle]="{'height':'110px', 'align-items':'center', 'padding':'0 20px', 'box-sizing': 'border-box', 'justify-content': 'center'}">

      <div id="titleTablero" [ngStyle]="{'height':'50px', 'display':'flex', 'align-items':'center', 'box-sizing':'border-box'}">
          <img src="./assets/images/tablero_icono_nuevo_header.svg" alt="">
          <label [ngStyle]="{'margin-left':'10px', 'color':'#3B8EDE', 'font-size':'21px', 'font-weight':'500'}"> Tableros</label>
      </div>
    
    <div class="column" >
      <div id="droplist">
        <gn-drop-list (valueDropList)="dropList($event)" [items]="itemsDropList2" [isSearch]="true" [isCategory]="true" [align]="'left'"
          [itemSelect]="defaultSelected"></gn-drop-list>
      </div>
    </div>
    <div class="column" >
      <div [ngStyle]="{'flex-direction':'row', 'display':'flex', 'align-items':'center', 'font-size':'13px'}">
        <label [ngStyle]="{'width':'95px', 'color':'#818192', 'display':'flex','flex-direction':'column', 'justify-content':'flex-end', 'height':'20px'}">Ordenar desde: </label>
        <div id="datepicker1">
          <gn-date-picker [style.width]="'125px'"
                          [(date)]="date"
                          dateFormat="YYYYMMDD"
                          [sizeInput]="'14px'"
                          [lineColor]="invalidDates ? '#C1272D' : '#3369B1'"
                          (dateChange)="handleValidDates()"
                          (handleCalculateDate)="handleCalculateDate($event)"
                          (onSelect)="handleDate($event, 'start')"
                          (fecha)="getFechaImpl($event)"></gn-date-picker>
        </div>

      </div>
    </div>
    <div class="column" >
      <div [ngStyle]="{'flex-direction':'row', 'display':'flex', 'align-items':'center', 'font-size':'13px'}">
        <label [ngStyle]="{'width':'45px', 'color':'#818192', 'display':'flex','flex-direction':'column', 'justify-content':'flex-end', 'height':'20px'}">Hasta: </label>
        <div id="datepicker2">
          <gn-date-picker [(date)]="date2"
                          dateFormat="YYYYMMDD"
                          [sizeInput]="'14px'"
                          [lineColor]="invalidDates ? '#C1272D' : '#3369B1'"
                          (dateChange)="handleValidDates()"
                          (handleCalculateDate)="handleCalculateDate($event)"
                          (onSelect)="handleDate($event, 'end')"
                          (fecha)="getFechaImpl($event)"></gn-date-picker>
        </div>

      </div>
    </div>
    <div class="column" [ngStyle]="{ 'display':'flex', 'justify-content':'flex-end'}" id="boton">
      <div  [ngStyle]="{'display':'flex', 'justify-content':'flex-end'}">
        <a class="apply" (click)="apply()">
          <p>APLICAR</p>
        </a>
      </div>


      <div id="boton" [ngStyle]="{'display':'flex', 'justify-content':'flex-end'}">
        <a class="exp" (click)="pdfDownload()">
          <p>EXPORTAR</p>
        </a>
      </div>
    </div>

    

  </div>


  <!-- ****************************************************************** Seccion 501 - Informacion General ****************************************************************** -->
  <div  class="section" *ngIf="seccion == 0">
    <!-- seccion 501 - Informacion General -->

    <div class="row" id="section" [style.width]="resolutionPdf ? '2000px' : null">
      <div [style.width]="resolutionPdf ? '750px' : '60%'" id="img1_501" class="column" [ngStyle]="{'justify-content':'center', 'height':'355px', 'position':'relative', 'background-color':'#F3FAFF'}">

        <div id='doughnut1Div'[style.width]="resolutionPdf ? '300px' : null" [style.height]="resolutionPdf ? '250px' : null">

          <div class="total" id="totalDoughnut1">
            <label>Total:</label>
            <label [ngClass]="total_OperacionesPeriodo > 9999 && total_OperacionesPeriodo < 100000 ? 'doughnut1Label2': total_OperacionesPeriodo > 99999 ? 'doughnut1Label3': 'doughnut1Label1'">{{ total_OperacionesPeriodo | acFormatNumber }}</label>
            <label *ngIf="total_OperacionesPeriodo !== 1">Operaciones</label>
            <label *ngIf="total_OperacionesPeriodo == 1">Operación</label>
          </div>

          <canvas id="doughnut1"></canvas>
        </div>


        <div class="legend" id="legendDoughnut1">
          <div class="head">
            <label>Operaciones Del Periodo</label>
          </div>
          <div class="body">
            <div>
              <span [style.background-color]="'#5792F3'"></span>
              <label>Importaciones</label>
              <label>{{importaciones_OperacionesPeriodo | acFormatNumber}}</label>
            </div>
            <div>
              <span [style.background-color]="'#FEC42D'"></span>
              <label>Exportaciones</label>
              <label>{{exportaciones_OperacionesPeriodo | acFormatNumber}}</label>
            </div>
            <div>
              <span [style.background-color]="'#DD4444'"></span>
              <label>Rectificaciones</label>
              <label>{{rectificaciones_OperacionesPeriodo | acFormatNumber}}</label>
            </div>
          </div>
          <div class="foot">
            <label>Total de operaciones: {{ total_OperacionesPeriodo | acFormatNumber }}</label>
          </div>
        </div>

      </div>



      <div id="img2_501" class="column" [ngStyle]="{'width':'40%', 'background-color':'#222E42', 'box-sizing':'border-box', 'position':'relative'}" >

            <label>{{ minimo_tipoCambioPeriodo| acFormatMoney }}</label>
            <label>{{ promedio_tipoCambioPeriodo| acFormatMoney }}</label>
            <label>{{ maximo_tipoCambioPeriodo| acFormatMoney }}</label>
          </div>
        </div>


      </div>

    </div>
